<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 连接测试</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .success { color: green; }
    .error { color: red; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>尚宴礼记 - 后台管理页面测试</h1>
  
  <h2>测试 1: 静态页面加载</h2>
  <p class="success">✅ 如果你看到这个页面，说明 HTTP 服务器正常运行</p>
  
  <h2>测试 2: API 连接测试</h2>
  <button onclick="testAPI()">测试 API 连接</button>
  <div id="api-result"></div>
  
  <h2>测试 3: 主应用加载</h2>
  <p>主应用 JS 文件: <a href="./assets/index-BpkNXTWE.js" target="_blank">index-BpkNXTWE.js</a></p>
  <p>点击查看 JS 文件是否正确加载</p>
  
  <h2>测试 3: 直接访问主应用</h2>
  <a href="./index.html">返回主应用</a>
  
  <script>
    async function testAPI() {
      const resultDiv = document.getElementById('api-result');
      resultDiv.innerHTML = '测试中...';
      
      try {
        const response = await fetch('https://web-production-201e9.up.railway.app/api/health', {
          method: 'GET',
          mode: 'cors',
          headers: {
            'Accept': 'application/json',
          },
        });
        
        if (!response.ok) {
          throw new Error('HTTP ' + response.status + ' ' + response.statusText);
        }
        
        const data = await response.json();
        resultDiv.innerHTML = '<p class="success">✅ API 连接成功!</p><pre>' + JSON.stringify(data, null, 2) + '</pre>';
      } catch (error) {
        resultDiv.innerHTML = '<p class="error">❌ API 连接失败: ' + error.message + '</p><p>尝试直接访问: <a href="https://web-production-201e9.up.railway.app/api/health" target="_blank">/api/health</a></p>';
      }
    }
  </script>
</body>
</html>
